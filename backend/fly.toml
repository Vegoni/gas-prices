# Fly.io deployment config for the Gas Price API.
# Run `fly launch --no-deploy --copy-config` once to register the app — that
# step rewrites `app =` and `primary_region` to your chosen values.

app = "us-gas-prices-api"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "gas_data"
  destination = "/data"
